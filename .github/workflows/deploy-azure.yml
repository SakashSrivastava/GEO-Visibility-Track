name: Deploy backend to Azure Container Apps

# Builds the backend Docker image, pushes it to GitHub Container Registry (GHCR),
# and rolls it out to an Azure Container App.
#
# Before Azure is configured, this workflow still runs green: it builds + pushes
# the image and skips the Azure steps with a notice. Once you add the
# AZURE_CREDENTIALS secret and complete the one-time setup in docs/DEPLOYMENT.md,
# every push to backend/** deploys automatically.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sakashsrivastava/geo-visibility-api
  APP: geo-visibility-api
  GROUP: geo-visibility-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}

      - name: Azure login
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new image to Container App
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            if az containerapp show -n "$APP" -g "$GROUP" >/dev/null 2>&1; then
              az containerapp update -n "$APP" -g "$GROUP" --image "$IMAGE:${{ github.sha }}"
              echo "Deployed $IMAGE:${{ github.sha }}"
            else
              echo "::warning::Container App '$APP' not found. Run the one-time setup in docs/DEPLOYMENT.md (it creates the app from the image just pushed to GHCR), then re-run this workflow."
              exit 1
            fi

      - name: Azure not configured yet
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        run: echo "::notice::Image pushed to GHCR. Add the AZURE_CREDENTIALS secret and complete the one-time Azure setup in docs/DEPLOYMENT.md to enable automatic deploys."
